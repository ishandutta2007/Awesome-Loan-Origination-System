<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
    }
    .float-item-1 {
      animation: float1 4s infinite ease-in-out;
    }
    .float-item-2 {
      animation: float2 5s infinite ease-in-out;
    }
    .shimmer {
      animation: shimmer 6s infinite linear;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes shimmer {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Canvas Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Dynamic Glowing Background Nodes -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.07" class="pulse-circle"/>
  <circle cx="1050" cy="240" r="140" fill="#818cf8" opacity="0.08" class="pulse-circle" style="animation-delay: 1.5s;"/>

  <!-- Grid Tech Lines -->
  <path d="M 0 160 Q 300 120, 600 160 T 1200 160" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,6" opacity="0.5"/>
  <path d="M 0 220 Q 400 260, 800 210 T 1200 240" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Floating Financial / LOS Graphic Elements (Right Side) -->
  <g transform="translate(840, 40)">
    <!-- Decorative Card 1: Loan Application Approval -->
    <g class="float-item-1">
      <rect x="60" y="20" width="240" height="130" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" filter="url(#subtleGlow)"/>
      <rect x="80" y="40" width="100" height="12" rx="4" fill="#38bdf8"/>
      <rect x="80" y="60" width="150" height="8" rx="3" fill="#475569"/>
      <rect x="80" y="76" width="120" height="8" rx="3" fill="#334155"/>
      <!-- Status Badge -->
      <rect x="80" y="100" width="85" height="24" rx="12" fill="#166534"/>
      <text x="122" y="116" class="badge-text" text-anchor="middle">APPROVED</text>
      <!-- Checkmark Icon -->
      <circle cx="250" cy="50" r="16" fill="#22c55e" opacity="0.2"/>
      <path d="M 244 50 L 248 54 L 256 44" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Decorative Card 2: Analytics & Underwriting -->
    <g class="float-item-2">
      <rect x="0" y="100" width="220" height="140" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6" filter="url(#subtleGlow)"/>
      <text x="20" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">CREDIT DECISIONING</text>
      <!-- Bar Chart -->
      <rect x="20" y="180" width="18" height="40" rx="3" fill="#38bdf8"/>
      <rect x="46" y="160" width="18" height="60" rx="3" fill="#818cf8"/>
      <rect x="72" y="145" width="18" height="75" rx="3" fill="#c084fc"/>
      <rect x="98" y="165" width="18" height="55" rx="3" fill="#38bdf8"/>
      <!-- Credit Score Dial -->
      <circle cx="165" cy="175" r="28" fill="none" stroke="#334155" stroke-width="6"/>
      <path d="M 145 185 A 25 25 0 1 1 185 185" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
      <text x="165" y="178" font-family="sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle">785</text>
      <text x="165" y="192" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">EXCELLENT</text>
    </g>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Tag -->
    <g transform="translate(0, 50)">
      <rect width="210" height="30" rx="15" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5"/>
      <circle cx="18" cy="15" r="5" fill="#38bdf8" class="pulse-circle"/>
      <text x="32" y="20" class="badge-text" fill="#38bdf8">FINTECH &amp; LENDING ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#subtleGlow)">
      Awesome <tspan fill="url(#accentGrad)">Loan Origination</tspan> System
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">
      Curated SaaS Platforms, Mortgage Engines &amp; Open-Source Banking LOS
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 215)">
      <!-- Badge 1: SaaS LOS -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="65" y="21" class="badge-text" text-anchor="middle" fill="#e2e8f0">🏦 Enterprise SaaS</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(142, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="72" y="21" class="badge-text" text-anchor="middle" fill="#e2e8f0">⚡ Open Source Core</text>
      </g>
      <!-- Badge 3: Underwriting -->
      <g transform="translate(299, 0)">
        <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="82" y="21" class="badge-text" text-anchor="middle" fill="#e2e8f0">📊 Underwriting &amp; POS</text>
      </g>
      <!-- Badge 4: Compliance -->
      <g transform="translate(476, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="67" y="21" class="badge-text" text-anchor="middle" fill="#e2e8f0">🛡️ Compliance</text>
      </g>
    </g>
  </g>
</svg>
